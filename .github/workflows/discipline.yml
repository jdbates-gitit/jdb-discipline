name: Daily Discipline

on:
  schedule:
    # Multiple early-morning attempts provide redundancy across CST/CDT and
    # GitHub scheduling delays. The Python date gate lets the first run that
    # actually starts each day proceed; later attempts exit cleanly.
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-discipline-main
  cancel-in-progress: false

jobs:
  build-discipline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run discipline script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_NOW: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python discipline_dashboard.py
      - name: Commit and push updated dashboard
        run: |
          git config --global user.email "jdbates@gmail.com"
          git config --global user.name "jdbates-gitit"
          git add index.html
          if [ -f run_state.json ]; then git add run_state.json; fi
          if git diff --staged --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "auto-update daily discipline"
          git push
