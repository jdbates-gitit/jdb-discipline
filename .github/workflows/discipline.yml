name: Daily Discipline
run-name: Daily Discipline · ${{ github.event_name }} · ${{ inputs.mode || 'scheduled' }} · ${{ inputs.expected_date || 'current day' }}

on:
  schedule:
    # Independent backups after the Cloudflare controller's 1:15 a.m.
    # primary attempt. A complete current page makes either a clean no-op.
    - cron: '45 4 * * *'
      timezone: 'America/Chicago'
    # Temporary second backup while Cloudflare timer delivery is investigated.
    - cron: '45 5 * * *'
      timezone: 'America/Chicago'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Refresh manually, or safely ensure today is complete'
        type: choice
        options: [force_refresh, ensure_fresh]
        default: force_refresh
      expected_date:
        description: 'Scheduler date in Houston (YYYY-MM-DD); leave blank for manual runs'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-discipline-main
  cancel-in-progress: false

jobs:
  build-discipline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run discipline script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'ensure_fresh' && '1' || '0' }}
          EXPECTED_DATE: ${{ inputs.expected_date || '' }}
        run: python discipline_dashboard.py
      - name: Commit and push updated dashboard
        run: |
          git config --global user.email "jdbates@gmail.com"
          git config --global user.name "jdbates-gitit"
          git add index.html
          if [ -f run_state.json ]; then git add run_state.json; fi
          if git diff --staged --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "auto-update daily discipline"
          git push
